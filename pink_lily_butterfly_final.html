<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Lily For You ♡</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;font-family:Georgia,serif;background:radial-gradient(circle at 50% 42%,#713f69 0%,#382545 43%,#151222 100%);color:white}
.stars span{position:absolute;width:3px;height:3px;background:#ffd9ef;border-radius:50%;box-shadow:0 0 8px #ffb9df;animation:twinkle 2s infinite alternate}
.stars span:nth-child(1){top:9%;left:12%}.stars span:nth-child(2){top:18%;left:80%;animation-delay:.4s}.stars span:nth-child(3){top:31%;left:22%;animation-delay:1s}.stars span:nth-child(4){top:13%;left:48%;animation-delay:.7s}.stars span:nth-child(5){top:29%;left:91%;animation-delay:1.2s}.stars span:nth-child(6){top:42%;left:8%;animation-delay:.2s}.stars span:nth-child(7){top:7%;left:67%;animation-delay:1.5s}.stars span:nth-child(8){top:37%;left:73%;animation-delay:.8s}
@keyframes twinkle{from{opacity:.2;transform:scale(.5)}to{opacity:1;transform:scale(1.5)}}
.intro{position:absolute;top:9%;width:100%;text-align:center;color:#ffe4f2;font-size:15px;letter-spacing:4px;opacity:0;animation:fadeIn 2s ease forwards;animation-delay:.7s}
@keyframes fadeIn{to{opacity:1}}
.moon{position:absolute;top:7%;right:10%;width:55px;height:55px;border-radius:50%;background:#fff0fa;box-shadow:0 0 25px rgba(255,210,239,.5)}
.moon:after{content:"";position:absolute;top:-5px;left:15px;width:55px;height:55px;border-radius:50%;background:#352542}
.garden{position:absolute;width:330px;height:76vh;left:50%;bottom:0;transform:translateX(-50%)}
.stem{position:absolute;width:7px;height:0;left:50%;bottom:0;border-radius:10px;background:linear-gradient(to right,#304b38,#9bb778,#405d43);transform:translateX(-50%);animation:stemGrow 3s ease forwards}
@keyframes stemGrow{to{height:57%}}
.leaf{position:absolute;width:110px;height:38px;opacity:0;background:linear-gradient(135deg,#36553b,#91ad73)}
.leaf.left{left:8%;bottom:25%;border-radius:100% 0 100% 0;transform:rotate(-30deg) scale(0);animation:leafLeft 1.5s ease forwards;animation-delay:2s}
.leaf.right{right:8%;bottom:37%;border-radius:0 100% 0 100%;transform:rotate(30deg) scale(0);animation:leafRight 1.5s ease forwards;animation-delay:2.3s}
@keyframes leafLeft{to{opacity:1;transform:rotate(-30deg) scale(1)}}@keyframes leafRight{to{opacity:1;transform:rotate(30deg) scale(1)}}
.flower{position:absolute;width:220px;height:220px;left:50%;bottom:52%;transform:translateX(-50%);filter:drop-shadow(0 0 18px rgba(255,155,215,.25))}
.petal{position:absolute;left:50%;top:50%;width:75px;height:140px;background:radial-gradient(ellipse at 50% 25%,#fffafd 0%,#ffd8ec 42%,#f28aba 100%);border-radius:72% 72% 42% 42%;transform-origin:50% 100%;opacity:0;box-shadow:inset 0 -12px 20px rgba(215,75,140,.12),0 0 15px rgba(255,175,220,.25)}
.petal:after{content:"";position:absolute;left:50%;top:20%;width:2px;height:65%;background:rgba(210,72,135,.35);transform:translateX(-50%)}
.petal:nth-child(1){transform:translate(-50%,-100%) rotate(0deg) scale(0);animation:bloom1 2s ease forwards;animation-delay:3.1s}
.petal:nth-child(2){transform:translate(-50%,-100%) rotate(60deg) scale(0);animation:bloom2 2s ease forwards;animation-delay:3.4s}
.petal:nth-child(3){transform:translate(-50%,-100%) rotate(120deg) scale(0);animation:bloom3 2s ease forwards;animation-delay:3.7s}
.petal:nth-child(4){transform:translate(-50%,-100%) rotate(180deg) scale(0);animation:bloom4 2s ease forwards;animation-delay:4s}
.petal:nth-child(5){transform:translate(-50%,-100%) rotate(240deg) scale(0);animation:bloom5 2s ease forwards;animation-delay:4.3s}
.petal:nth-child(6){transform:translate(-50%,-100%) rotate(300deg) scale(0);animation:bloom6 2s ease forwards;animation-delay:4.6s}
@keyframes bloom1{to{opacity:1;transform:translate(-50%,-100%) rotate(0deg) scale(1)}}@keyframes bloom2{to{opacity:1;transform:translate(-50%,-100%) rotate(60deg) scale(1)}}@keyframes bloom3{to{opacity:1;transform:translate(-50%,-100%) rotate(120deg) scale(1)}}@keyframes bloom4{to{opacity:1;transform:translate(-50%,-100%) rotate(180deg) scale(1)}}@keyframes bloom5{to{opacity:1;transform:translate(-50%,-100%) rotate(240deg) scale(1)}}@keyframes bloom6{to{opacity:1;transform:translate(-50%,-100%) rotate(300deg) scale(1)}}
.center{position:absolute;width:36px;height:36px;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);border-radius:50%;z-index:10;background:radial-gradient(circle,#fff8ad 0%,#f5d25d 45%,#d99535 100%);box-shadow:0 0 18px #ffe99b,0 0 40px rgba(255,175,220,.5);animation:center 1s ease forwards;animation-delay:5.2s}
@keyframes center{to{transform:translate(-50%,-50%) scale(1)}}
.butterfly-orbit{position:absolute;left:50%;top:38%;width:330px;height:330px;margin-left:-165px;margin-top:-165px;animation:orbit 12s linear infinite;pointer-events:none;z-index:20}
.butterfly-orbit.two{width:400px;height:400px;margin-left:-200px;margin-top:-200px;animation-duration:17s;animation-direction:reverse}
@keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.butterfly{position:absolute;top:0;left:50%;width:45px;height:38px;transform:translateX(-50%)}
.wing{position:absolute;top:3px;width:22px;height:31px;background:linear-gradient(135deg,#ffe1f2,#f276b5);box-shadow:0 0 12px rgba(255,154,215,.7)}
.wing.left{left:0;border-radius:80% 20% 70% 30%;transform-origin:right center;animation:flap .45s infinite alternate}
.wing.right{right:0;border-radius:20% 80% 30% 70%;transform-origin:left center;animation:flap .45s infinite alternate}
.body{position:absolute;left:50%;top:9px;width:5px;height:25px;background:#71405d;border-radius:50%;transform:translateX(-50%);z-index:5}
@keyframes flap{from{transform:rotateY(0deg)}to{transform:rotateY(65deg)}}
.falling{position:absolute;top:-30px;width:11px;height:17px;background:#ffc6e4;border-radius:70% 20% 70% 20%;opacity:.7;animation:fall linear infinite}
.falling:nth-of-type(1){left:12%;animation-duration:8s}.falling:nth-of-type(2){left:31%;animation-duration:11s;animation-delay:2s}.falling:nth-of-type(3){left:58%;animation-duration:9s;animation-delay:1s}.falling:nth-of-type(4){left:82%;animation-duration:12s;animation-delay:3s}
@keyframes fall{from{transform:translateY(-30px) rotate(0deg)}to{transform:translateY(110vh) translateX(100px) rotate(360deg)}}
.message{position:absolute;bottom:9%;width:100%;text-align:center;opacity:0;animation:messageIn 2s ease forwards;animation-delay:6s}
.message h1{font-size:27px;font-weight:normal;letter-spacing:2px;color:#ffe7f4;text-shadow:0 0 15px rgba(255,160,215,.7)}
.message p{margin-top:10px;font-family:Arial,sans-serif;font-size:11px;letter-spacing:3px;color:#ffd8ec;opacity:.75}
@keyframes messageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
button{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);padding:10px 22px;border:1px solid rgba(255,210,237,.5);border-radius:30px;background:rgba(255,190,225,.08);color:#ffe6f3;font-family:Georgia,serif;font-size:13px;letter-spacing:2px;cursor:pointer;backdrop-filter:blur(8px);transition:.3s;z-index:110}
button:hover{background:rgba(255,190,225,.2);transform:translateX(-50%) scale(1.05);box-shadow:0 0 20px rgba(255,160,215,.35)}
.surprise{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(22,13,30,.72);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:.6s;z-index:100}
.surprise.show{opacity:1;pointer-events:auto}
.surprise-box{text-align:center;padding:35px;max-width:330px;transform:translateY(25px) scale(.9);transition:.6s}
.surprise.show .surprise-box{transform:translateY(0) scale(1)}
.surprise h2{font-size:28px;font-weight:normal;color:#ffe1f1;text-shadow:0 0 15px #f58abd}
.surprise p{margin-top:15px;font-family:Arial,sans-serif;font-size:13px;line-height:1.7;color:#ffddec}
.close{margin-top:20px;position:static;transform:none}
.heart{position:fixed;font-size:22px;pointer-events:none;animation:heartFly 2.5s ease forwards;z-index:150}
@keyframes heartFly{0%{opacity:1;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-300px) translateX(var(--x)) scale(1.5) rotate(25deg)}}
@media(max-width:600px){.intro{font-size:12px;letter-spacing:3px}.moon{width:42px;height:42px;right:8%}.moon:after{width:42px;height:42px;left:12px}.garden{width:285px}.flower{width:190px;height:190px;bottom:51%}.petal{width:65px;height:120px}.butterfly-orbit{width:270px;height:270px;margin-left:-135px;margin-top:-135px}.butterfly-orbit.two{width:330px;height:330px;margin-left:-165px;margin-top:-165px}.message h1{font-size:23px}.message p{font-size:9px}}
</style>
</head>
<body>
<div class="stars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="moon"></div>
<div class="intro">something beautiful is growing...</div>

<div class="butterfly-orbit"><div class="butterfly"><div class="wing left"></div><div class="wing right"></div><div class="body"></div></div></div>
<div class="butterfly-orbit two"><div class="butterfly"><div class="wing left"></div><div class="wing right"></div><div class="body"></div></div></div>

<div class="garden">
<div class="stem"></div><div class="leaf left"></div><div class="leaf right"></div>
<div class="flower">
<div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
<div class="center"></div>
</div>
</div>

<div class="falling"></div><div class="falling"></div><div class="falling"></div><div class="falling"></div>



<button id="surpriseBtn">don't click this ♡</button>

<div class="surprise" id="surprise">
<div class="surprise-box">
<h2>you clicked it ♡</h2>
<p>I guess you were curious...<br>so here's a little reminder:<br><br>you deserve beautiful things,<br>soft moments, and lots of love.</p>
<button class="close" id="closeBtn">close ♡</button>
</div>
</div>

<script>
const surprise=document.getElementById("surprise");
document.getElementById("surpriseBtn").onclick=()=>{
 surprise.classList.add("show");
 for(let i=0;i<28;i++){
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML=["♡","♥","♡","💗"][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+"vw";
  h.style.top=(55+Math.random()*30)+"vh";
  h.style.setProperty("--x",(Math.random()*180-90)+"px");
  h.style.animationDelay=Math.random()*.7+"s";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),3200);
 }
};
document.getElementById("closeBtn").onclick=()=>surprise.classList.remove("show");
</script>
</body>
</html>
